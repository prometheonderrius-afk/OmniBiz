<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniBiz Live Chat Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: rgba(15, 23, 42, 0.45);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.35);
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
    }

    /* Glassmorphic Widget Container */
    .widget-container {
      width: 100%;
      height: 100%;
      max-width: 400px;
      max-height: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      overflow: hidden;
    }

    /* Header Styling */
    .widget-header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .business-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #6d28d9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 0 10px var(--accent-purple-glow);
    }

    .business-info {
      flex: 1;
    }

    .business-name {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .business-status {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
    }

    /* Message Area */
    .message-log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      border: 1px solid var(--border-glass);
    }

    .message-bubble.visitor {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #6d28d9 100%);
      border-bottom-right-radius: 2px;
      box-shadow: 0 2px 10px var(--accent-purple-glow);
    }

    .message-bubble.owner {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border-bottom-left-radius: 2px;
    }

    .message-sender {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .message-bubble.visitor .message-sender {
      color: rgba(255, 255, 255, 0.7);
    }

    .message-text {
      word-break: break-word;
    }

    /* Input Styling */
    .input-area {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-glass);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .chat-input:focus {
      border-color: var(--accent-purple);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 6px var(--accent-purple-glow);
    }

    .send-button {
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button:hover:not(:disabled) {
      background: #7c3aed;
      box-shadow: 0 0 8px var(--accent-purple-glow);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Error Banner */
    .error-banner {
      background: var(--accent-pink);
      color: white;
      padding: 8px 12px;
      font-size: 0.75rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div id="errorBanner" class="error-banner"></div>
    
    <!-- Widget Header -->
    <div class="widget-header">
      <div id="avatar" class="business-avatar">Ω</div>
      <div class="business-info">
        <div id="businessName" class="business-name">Loading...</div>
        <div class="business-status">
          <div class="status-dot"></div>
          <span id="subStatus">AI assistant online</span>
        </div>
      </div>
    </div>

    <!-- Message Logs -->
    <div id="messageLog" class="message-log">
      <!-- Welcome message -->
      <div class="message-bubble owner" style="align-self: flex-start;">
        <div class="message-sender">Assistant</div>
        <div class="message-text">Hi! Thanks for visiting. How can we help you today?</div>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chatForm" class="input-area">
      <input 
        id="chatInput" 
        type="text" 
        class="chat-input" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
      />
      <button id="sendBtn" type="submit" class="send-button">
        Send
      </button>
    </form>
  </div>

  <!-- Import Firebase modules via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, onSnapshot, query, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Same Firebase configuration credentials
    const firebaseConfig = {
      apiKey: "AIzaSyBvUqb-NMr_9lvE-7gpuSjnNImfzaYySKo",
      authDomain: "wacom-canvas.firebaseapp.com",
      projectId: "wacom-canvas",
      storageBucket: "wacom-canvas.firebasestorage.app",
      messagingSenderId: "948691108517",
      appId: "1:948691108517:web:b8412b3428bec908ddc34c"
    };

    // Parse UID from query parameters
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');

    const errorBanner = document.getElementById('errorBanner');
    const businessNameEl = document.getElementById('businessName');
    const avatarEl = document.getElementById('avatar');

    if (!uid) {
      errorBanner.innerText = "Error: Missing ?uid parameter in widget URL.";
      errorBanner.style.display = "block";
      businessNameEl.innerText = "Unknown Business";
    } else {
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch and display business profile details
        const userDocRef = doc(db, 'users', uid);
        getDoc(userDocRef).then((snap) => {
          if (snap.exists()) {
            const data = snap.data();
            const bData = data.businessData || {};
            businessNameEl.innerText = bData.name || "Our Business";
            if (bData.name) {
              avatarEl.innerText = bData.name.charAt(0).toUpperCase();
            }
          } else {
            businessNameEl.innerText = "OmniBiz Partner";
          }
        }).catch(err => {
          console.error("Profile load failure:", err);
          businessNameEl.innerText = "OmniBiz Partner";
        });

        // Real-time listener for the webChat collection
        const chatColRef = collection(db, 'users', uid, 'webChat');
        const messageLog = document.getElementById('messageLog');

        onSnapshot(chatColRef, (snap) => {
          // Collect and sort messages
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          // Clear dynamic messages
          const dynamicMsgs = messageLog.querySelectorAll('.message-bubble:not(:first-child)');
          dynamicMsgs.forEach(m => m.remove());

          // Append to log
          list.forEach(msg => {
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            bubble.classList.add(msg.isUser ? 'owner' : 'visitor');
            
            const sender = document.createElement('div');
            sender.classList.add('message-sender');
            sender.innerText = msg.sender || (msg.isUser ? 'OmniBiz AI' : 'Visitor');

            const text = document.createElement('div');
            text.classList.add('message-text');
            text.innerText = msg.text;

            bubble.appendChild(sender);
            bubble.appendChild(text);
            messageLog.appendChild(bubble);
          });

          // Scroll to bottom
          messageLog.scrollTop = messageLog.scrollHeight;
        });

        // Handle Form Submit (Sending message via Vercel serverless function)
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        chatForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const messageText = chatInput.value.trim();
          if (!messageText) return;

          chatInput.value = '';
          sendBtn.disabled = true;

          try {
            // Fetch the Vercel serverless function
            const response = await fetch('/api/webchat-message', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                uid: uid,
                text: messageText
              })
            });

            if (!response.ok) {
              throw new Error("Network response error.");
            }
          } catch (err) {
            console.error("Failed to post message:", err);
            // Fallback: If backend fails or local server is offline, write directly to Firestore (no AI response)
            const fallbackColRef = collection(db, 'users', uid, 'webChat');
            await addDoc(fallbackColRef, {
              sender: 'Visitor',
              text: messageText,
              isUser: false,
              createdAt: Date.now()
            });
          } finally {
            sendBtn.disabled = false;
            chatInput.focus();
          }
        });

      } catch (err) {
        errorBanner.innerText = `Firebase Init Error: ${err.message}`;
        errorBanner.style.display = "block";
      }
    }
  </script>
</body>
</html>
